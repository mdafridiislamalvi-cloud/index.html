
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investing Mini App</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #172338;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    h1 { color: #54e6a1; }
    .balance {
      font-size: 28px;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #54e6a1;
      color: #0b1220;
      font-size: 16px;
      font-weight: bold;
    }
    .note { color: #bdc8d8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Investing</h1>
  <p>তোমার ডেমো ট্রেডিং ড্যাশবোর্ড</p>

  <div class="card">
    <p>ডেমো ব্যালেন্স</p>
    <div class="balance">10,000 Demo USD</div>
    <p class="note">এটি কাল্পনিক ব্যালেন্স, আসল টাকা নয়।</p>
  </div>

  <div class="card">
    <h3>মার্কেট সিগন্যাল</h3>
    <p>BTC / USDT — Demo</p>
    <p>Market: Crypto</p>
    <p>অবস্থা: পরীক্ষামূলক</p>
    <button onclick="alert('এটি শুধু ডেমো। কোনো আসল ট্রেড হয়নি।')">
      ডেমো সিগন্যাল দেখো
    </button>
  </div>

  <div class="card">
    <h3>মার্কেটসমূহ</h3>
    <p>Crypto · Stocks · Gold · Forex</p>
    <p class="note">সিগন্যাল ও ব্যালেন্স এখনো পরীক্ষামূলক।</p>
  </div>
</body>
</html>
